<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전자출석 QR 화면</title>
<style>
  :root { --bg:#ffffff; --ink:#1c2230; --sub:#596273; --line:#d3d8e0; --acc:#1f5fbf;
          --stop:#b42318; --soft:#f2f4f7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  h1 { font-size: 24px; margin: 0 16px 0 0; }
  input { font-size: 17px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; min-width: 200px; }
  button { font-size: 17px; font-weight: 700; padding: 10px 16px; border: 0; border-radius: 8px;
           background: var(--soft); color: var(--ink); cursor: pointer; }
  button.main { background: var(--acc); color: #fff; }
  button.stop { background: var(--stop); color: #fff; }
  .status { color: var(--sub); font-size: 15px; margin: 10px 0 0; }
  #qrbox { display: flex; flex-wrap: wrap; gap: 56px; justify-content: center; align-items: center; margin-top: 18px; }
  #qrbox[hidden] { display: none; }
  .qrcol { text-align: center; }
  #qr { display: inline-block; background: #fff; }
  #qr img, #qr canvas { display: block; image-rendering: pixelated; }
  .timer { height: 8px; margin: 16px auto 0; background: var(--soft); border-radius: 4px; overflow: hidden; }
  .timer i { display: block; height: 100%; width: 100%; background: #8aa4c8; }
  .guide { font-size: 20px; margin: 12px 0 0; color: var(--sub); }
  .side { display: flex; flex-direction: column; gap: 22px; min-width: 240px; }
  .tile { border-radius: 16px; padding: 20px 24px; }
  .tile .lab { font-size: 18px; margin: 0; }
  .color { color: #fff; }
  .color .val { font-size: 46px; font-weight: 800; margin: 4px 0 0; }
  .countTile { background: var(--soft); }
  .countTile .val { font-size: 64px; font-weight: 800; margin: 2px 0 0; font-variant-numeric: tabular-nums; }
  .countTile .val small { font-size: 26px; font-weight: 700; margin-left: 4px; }
  .clock { font-size: 26px; font-weight: 700; color: var(--sub); font-variant-numeric: tabular-nums;
           font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; margin: 0; }
  #msg { margin-top: 16px; font-size: 17px; line-height: 1.6; white-space: pre-line; }
  #login { margin-top: 30px; }
  body.full .bar, body.full .status { display: none; }
</style>
</head>
<body>
<main>
  <div class="bar" id="ctrl">
    <h1>전자출석</h1>
    <input id="label" placeholder="회차 이름 (예: 공학탐색 11월 11일)">
    <button class="main" id="start">출석 시작</button>
    <button class="stop" id="stop">출석 마감</button>
    <button id="room">지금 위치를 강의실로 저장</button>
    <button id="full">전체 화면</button>
  </div>
  <p class="status" id="status">서버에 연결하는 중입니다.</p>

  <div id="login" hidden>
    <p>구글 시트의 '설정' 시트에 있는 교수 화면 비밀번호를 입력하세요.</p>
    <input id="key" autocomplete="off"> <button class="main" id="keyOk">확인</button>
  </div>

  <div id="qrbox" hidden>
    <div class="qrcol">
      <div id="qr"></div>
      <div class="timer" id="timerBox"><i id="timer"></i></div>
      <p class="guide">휴대전화 기본 카메라로 찍으세요 · 10초마다 바뀜</p>
    </div>
    <div class="side">
      <div class="tile color" id="colorTile">
        <p class="lab">오늘의 색</p>
        <p class="val" id="colorName"></p>
      </div>
      <div class="tile countTile">
        <p class="lab">출석</p>
        <p class="val"><span id="count">0</span><small>명</small></p>
      </div>
      <p class="clock" id="clock"></p>
    </div>
  </div>

  <div id="msg"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const api = window.attendApi, store = window.attendStore;
  // 주소를 짧게 할수록 QR 코드의 칸 수가 줄어 칸 하나가 커지고 휴대전화가 읽기 쉬워진다.
  const studentUrl = window.STUDENT_URL || new URL('./', location.href).href;
  let key = store('gast_admin') || '';
  let offset = 0, timer = null;

  const say = t => { $('msg').textContent = t || ''; };

  function needLogin(m) {
    clearTimeout(timer);
    $('login').hidden = false; $('qrbox').hidden = true;
    $('status').textContent = m || '비밀번호가 필요합니다.';
  }

  // 휴대전화 카메라가 화면의 QR 코드를 잘 읽도록 한 칸의 크기를 정수 픽셀로 맞추고
  // 둘레에 칸 4개 너비의 흰 여백을 둔다.
  function drawQr(url) {
    const target = Math.max(300, Math.min(800, Math.floor(Math.min(innerWidth * 0.6, innerHeight * 0.82))));
    const box = $('qr');
    box.innerHTML = '';
    let qr = new QRCode(box, { text: url, width: target, height: target, correctLevel: QRCode.CorrectLevel.L });
    const n = qr._oQRCode ? qr._oQRCode.getModuleCount() : 33;
    const cell = Math.max(6, Math.floor(target / (n + 8)));
    box.innerHTML = '';
    qr = new QRCode(box, { text: url, width: cell * n, height: cell * n, correctLevel: QRCode.CorrectLevel.L });
    box.style.padding = (cell * 4) + 'px';
    $('timerBox').style.width = (cell * (n + 8)) + 'px';
  }

  function paintColor() {
    const c = window.todayColor();
    $('colorTile').style.background = c.hex;
    $('colorName').textContent = c.name;
    $('clock').textContent = window.kstClock();
  }
  paintColor(); setInterval(paintColor, 1000);

  function runTimer(slotEnd) {
    const left = Math.max(0, slotEnd - (Date.now() + offset));
    const bar = $('timer');
    bar.style.transition = 'none'; bar.style.width = (left / 100) + '%';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      bar.style.transition = 'width ' + left + 'ms linear'; bar.style.width = '0%';
    }));
  }

  function render(r) {
    $('login').hidden = true;
    const roomText = r.room ? '강의실 위치가 저장되어 있습니다.' : '강의실 위치가 아직 없습니다. 강의실에서 위치 저장을 눌러 주세요.';
    if (r.session && r.token) {
      $('status').textContent = '진행 중: ' + r.session + ' · ' + roomText;
      drawQr(studentUrl + '?t=' + r.token);
      runTimer(r.slotEnd);
      $('count').textContent = r.count || 0;
      $('qrbox').hidden = false;
    } else {
      $('status').textContent = '출석이 열려 있지 않습니다. · ' + roomText;
      $('qrbox').hidden = true;
    }
  }

  async function tick() {
    clearTimeout(timer);
    if (!key) return needLogin();
    try {
      const r = await api({ action: 'adminState', key: key });
      if (!r.ok) { if (r.auth === false) return needLogin(r.msg); throw new Error(r.msg); }
      offset = r.serverNow - Date.now();
      render(r);
      if (r.session) timer = setTimeout(tick, Math.max(500, r.slotEnd - (Date.now() + offset) + 300));
    } catch (e) {
      $('status').textContent = '서버 연결이 끊겼습니다. 다시 시도하는 중입니다.';
      timer = setTimeout(tick, 3000);
    }
  }

  $('keyOk').onclick = () => { key = $('key').value.trim(); store('gast_admin', key); say(''); tick(); };

  $('start').onclick = async () => {
    say('');
    try {
      const r = await api({ action: 'adminStart', key: key, label: $('label').value });
      if (!r.ok) { if (r.auth === false) return needLogin(r.msg); return say(r.msg); }
      tick();
    } catch (e) { say('서버에 연결하지 못했습니다.'); }
  };

  $('stop').onclick = async () => {
    if (!confirm('출석을 마감할까요? 마감한 뒤에는 QR 코드로 출석할 수 없습니다.')) return;
    clearTimeout(timer);
    say('마감하고 점검하는 중입니다. 몇 초 걸립니다.');
    try {
      const r = await api({ action: 'adminStop', key: key });
      if (!r.ok) { if (r.auth === false) return needLogin(r.msg); return say(r.msg); }
      say((r.session ? r.session + ' 마감\n' : '') + '출석 ' + r.total + '명 중 확인 필요 ' + r.flagged + '명\n' +
          '구글 시트 출석기록에서 확인 결과가 "확인 필요"인 행과 사유를 보시면 됩니다.');
      tick();
    } catch (e) { say('서버에 연결하지 못했습니다. 다시 눌러 주세요.'); }
  };

  $('room').onclick = () => {
    if (!navigator.geolocation) return say('이 브라우저는 위치 확인을 지원하지 않습니다.');
    // 데스크톱·노트북은 GPS가 없어 위치가 수 km까지 틀릴 수 있으므로 휴대전화에서만 저장한다.
    if (!navigator.maxTouchPoints) return say('강의실 위치는 강의실에서 휴대전화로 저장해 주세요.');
    say('위치를 확인하는 중입니다.');
    navigator.geolocation.getCurrentPosition(async p => {
      const acc = Math.round(p.coords.accuracy);
      if (acc > 100) return say('위치를 정확히 잡지 못해 저장하지 않았습니다. 강의실에서 휴대전화로 다시 눌러 주세요.');
      if (!confirm('지금 위치를 강의실로 저장할까요? 기존 강의실 좌표는 지워집니다.')) return say('');
      try {
        const r = await api({ action: 'adminRoom', key: key, lat: p.coords.latitude, lng: p.coords.longitude });
        if (!r.ok) return say(r.msg);
        say('강의실 위치를 저장했습니다.');
        tick();
      } catch (e) { say('서버에 연결하지 못했습니다.'); }
    }, () => say('위치를 확인하지 못했습니다. 브라우저의 위치 권한을 허용해 주세요.'),
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  };

  $('full').onclick = () => {
    document.body.classList.add('full');
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  };
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) document.body.classList.remove('full'); });

  tick();
</script>
</body>
</html>
