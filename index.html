<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전자출석</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1c2230; --sub:#596273; --line:#c9ced8;
          --acc:#1f5fbf; --ok:#0d7348; --okbg:#e2f3ea; --err:#b42318; --errbg:#fdecea; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 28px 16px 40px; }
  h1 { font-size: 23px; margin: 0 0 6px; }
  .sub { color: var(--sub); font-size: 16px; margin: 0 0 20px; line-height: 1.5; }
  .card { background: var(--card); border-radius: 14px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  label { display: block; font-size: 16px; font-weight: 700; margin: 12px 0 6px; }
  input { width: 100%; font-size: 21px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
  button { width: 100%; margin-top: 22px; font-size: 21px; font-weight: 700; padding: 16px;
           border: 0; border-radius: 12px; background: var(--acc); color: #fff; }
  button:disabled { opacity: .55; }
  .note { font-size: 14px; color: var(--sub); margin: 14px 0 0; line-height: 1.55; }
  .msg { margin-top: 16px; padding: 18px; border-radius: 12px; font-size: 18px; line-height: 1.5; }
  .msg.ok { background: var(--okbg); color: var(--ok); }
  .msg.err { background: var(--errbg); color: var(--err); }
  .big { display: block; font-size: 28px; font-weight: 800; margin-bottom: 4px; }
  #done { position: fixed; inset: 0; color: #1d3a5f; display: flex; flex-direction: column;
          align-items: center; justify-content: center; text-align: center; padding: 24px 16px; overflow: hidden;
          background: linear-gradient(180deg, #a9d8f5 0%, #d4ecfb 55%, #f3f9fe 100%); }
  #done[hidden] { display: none; }
  #done > p, #done > .cloud { position: relative; z-index: 1; }
  .sky { position: absolute; inset: 0; pointer-events: none; }
  .sky svg { position: absolute; left: 0; fill: #fff; animation: drift linear infinite; }
  .cloud { width: 170px; height: 110px; flex-shrink: 0; animation: float 3s ease-in-out infinite;
           filter: drop-shadow(0 6px 10px rgba(60,110,160,.18)); }
  .cloud .eye { transform-box: fill-box; transform-origin: center; animation: wink 4s infinite; }
  .d-title { font-size: 28px; font-weight: 800; margin: 18px 0 0; }
  .d-name { font-size: 40px; font-weight: 800; margin: 8px 0 0; letter-spacing: 0.02em; }
  .d-clock { font-size: 52px; font-weight: 800; margin: 28px 0 0; font-variant-numeric: tabular-nums;
             font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .d-live { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; margin: 2px 0 0; opacity: .9; }
  .d-live i { width: 9px; height: 9px; border-radius: 50%; background: #3f7fc4; animation: blink 1s infinite; }
  .d-bye { font-size: 22px; font-weight: 700; margin: 30px 0 0; }
  @keyframes blink { 50% { opacity: .2; } }
  @keyframes float { 50% { transform: translateY(-10px); } }
  @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(110vw); } }
  @keyframes wink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
</style>
</head>
<body>
<main>
  <h1>전자출석</h1>
  <p class="sub" id="state">QR 코드를 확인하는 중입니다.</p>

  <div class="card" id="formCard" hidden>
    <label for="sid">학번</label>
    <input id="sid" inputmode="numeric" autocomplete="off" maxlength="10">
    <label for="name">이름</label>
    <input id="name" autocomplete="off">
    <button id="go">출석하기</button>
    <p class="note">처음 한 번만 입력하면 다음부터는 자동으로 채워집니다.<br>
      위치 권한을 묻는 창이 뜨면 <b>허용</b>을 눌러 주세요. 허용하지 않으면 출석이 확인 대상으로 분류됩니다.<br>
      학교 와이파이에 연결한 상태로 출석해 주세요.</p>
  </div>

  <div id="result"></div>
</main>

<div id="done" hidden>
  <div class="sky" id="sky"></div>
  <svg class="cloud" viewBox="0 0 170 110" aria-hidden="true">
    <g fill="#fff">
      <circle cx="58" cy="52" r="30"/><circle cx="98" cy="42" r="36"/><circle cx="130" cy="64" r="26"/>
      <circle cx="36" cy="72" r="22"/><rect x="36" y="58" width="100" height="36" rx="18"/>
    </g>
    <ellipse class="eye" cx="72" cy="62" rx="5" ry="7" fill="#2c2c2a"/>
    <ellipse class="eye" cx="104" cy="62" rx="5" ry="7" fill="#2c2c2a"/>
    <ellipse cx="60" cy="76" rx="8" ry="5" fill="#f4a7b9"/>
    <ellipse cx="116" cy="76" rx="8" ry="5" fill="#f4a7b9"/>
    <path d="M80 74 Q88 83 96 74" fill="none" stroke="#2c2c2a" stroke-width="3.5" stroke-linecap="round"/>
  </svg>
  <p class="d-title" id="dTitle">출석이 인정되었습니다</p>
  <p class="d-name" id="dName"></p>
  <p class="d-clock" id="dClock"></p>
  <p class="d-live"><i></i>현재 시각</p>
  <p class="d-bye">좋은 하루 되세요</p>
</div>

<script src="config.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const api = window.attendApi, store = window.attendStore;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const show = (kind, html) => { $('result').innerHTML = '<div class="msg ' + kind + '">' + html + '</div>'; };

  function deviceId() {
    let d = store('gast_dev');
    if (!d) {
      d = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : Date.now().toString(36) + Math.random().toString(36).slice(2);
      store('gast_dev', d);
    }
    return d;
  }
  const dev = deviceId();

  // 페이지가 열리자마자 위치와 접속 주소를 함께 확인한다.
  const geo = new Promise(res => {
    if (!navigator.geolocation) return res({ err: '지원 안 함' });
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      e => res({ err: ({ 1: '권한 거부', 2: '위치 확인 실패', 3: '시간 초과' })[e.code] || '오류' }),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
  const ipP = Promise.race([
    fetch('https://api.ipify.org?format=json').then(r => r.json()).then(j => j.ip).catch(() => ''),
    new Promise(r => setTimeout(() => r(''), 4000)),
  ]);

  let ticket = null;

  (async () => {
    const t = new URLSearchParams(location.search).get('t');
    if (!t) { $('state').textContent = '강의실 화면의 QR 코드를 휴대전화 카메라로 찍어서 들어와 주세요.'; return; }
    history.replaceState(null, '', location.pathname);
    try {
      const r = await api({ action: 'open', t: t });
      if (!r.ok) { $('state').textContent = ''; show('err', esc(r.msg)); return; }
      ticket = r.ticket;
    } catch (e) {
      $('state').textContent = '';
      show('err', '서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 QR 코드를 다시 찍어 주세요.');
      return;
    }
    $('sid').value = store('gast_sid') || '';
    $('name').value = store('gast_name') || '';
    $('state').textContent = '학번과 이름을 확인하고 출석하기를 눌러 주세요.';
    $('formCard').hidden = false;
  })();

  // 출석에 성공하면 구름이 떠다니는 하늘 화면으로 바꾸고 현재 시각을 초 단위로 보여 준다.
  // 교수가 화면을 보고 시계가 움직이는지(캡처한 사진이 아닌지) 확인할 수 있다.
  function showDone(r) {
    document.body.style.background = '#a9d8f5';
    document.querySelector('meta[name=viewport]').insertAdjacentHTML('afterend', '<meta name="theme-color" content="#a9d8f5">');
    const shape = '<g><circle cx="58" cy="52" r="30"/><circle cx="98" cy="42" r="36"/><circle cx="130" cy="64" r="26"/>' +
      '<circle cx="36" cy="72" r="22"/><rect x="36" y="58" width="100" height="36" rx="18"/></g>';
    // [위쪽 위치 %, 너비 px, 흐르는 시간 초, 시작 시점 초, 투명도]
    [[6, 150, 38, -5, .9], [20, 90, 52, -30, .7], [34, 120, 44, -18, .55],
     [58, 160, 60, -42, .8], [74, 100, 40, -12, .65], [88, 130, 56, -26, .85]].forEach(c => {
      $('sky').insertAdjacentHTML('beforeend', '<svg viewBox="0 0 170 110" style="top:' + c[0] + '%;width:' + c[1] +
        'px;animation-duration:' + c[2] + 's;animation-delay:' + c[3] + 's;opacity:' + c[4] + '">' + shape + '</svg>');
    });
    $('dTitle').textContent = r.already ? '이미 출석되어 있습니다' : '출석이 인정되었습니다';
    $('dName').textContent = r.name;
    const tickClock = () => { $('dClock').textContent = window.kstClock(); };
    tickClock(); setInterval(tickClock, 1000);
    $('done').hidden = false;
  }

  function resetButton() { $('go').disabled = false; $('go').textContent = '출석하기'; }

  $('go').onclick = async () => {
    const sid = $('sid').value.replace(/\D/g, ''), name = $('name').value.trim();
    if (!/^\d{8,10}$/.test(sid)) return show('err', '학번을 숫자로 정확히 입력해 주세요.');
    if (!name) return show('err', '이름을 입력해 주세요.');
    $('go').disabled = true; $('go').textContent = '확인하는 중입니다';
    const g = await geo, ip = await ipP;
    try {
      const r = await api({ action: 'checkin', ticket: ticket, sid: sid, name: name, dev: dev,
        lat: g.lat, lng: g.lng, acc: g.acc, geoErr: g.err || '', ip: ip });
      if (!r.ok) { show('err', esc(r.msg)); resetButton(); return; }
      store('gast_sid', sid); store('gast_name', name);
      showDone(r);
    } catch (e) {
      show('err', '서버에 연결하지 못했습니다. 잠시 뒤 출석하기를 다시 눌러 주세요.');
      resetButton();
    }
  };
</script>
</body>
</html>
